name: update readme stats

on:
  schedule:
    - cron: '17 4 * * *'   # every day, 04:17 utc
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [gen.py, .github/workflows/update.yml]   # rebuild right away when either changes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: regenerate svgs
        env:
          # built-in token is enough. add a METRICS_TOKEN secret only if you ever want to override it
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 gen.py

      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets stats.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "update stats"
            git push
          fi
